<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The EGG</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0f0a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    canvas { display: block; }
  </style>
</head>
<body>
<canvas id="game"></canvas>
<script>
// ─── Constants ───────────────────────────────────────────────
const W = 1280, H = 720;
const GROUND_Y    = H - 80;
const GRAVITY     = 1800;
const MOVE_SPEED  = 280;
const JUMP_VEL    = -620;
const COYOTE_TIME = 0.10;
const JUMP_BUFFER = 0.12;
const PW = 36, PH = 44;

// ─── Canvas ──────────────────────────────────────────────────
const canvas = document.getElementById('game');
const ctx    = canvas.getContext('2d');
canvas.width  = W;
canvas.height = H;

// Scale canvas to fit window while keeping aspect ratio
function resize() {
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width  = Math.floor(W * scale) + 'px';
  canvas.style.height = Math.floor(H * scale) + 'px';
}
window.addEventListener('resize', resize);
resize();

// ─── Input ───────────────────────────────────────────────────
const keys = new Set();
window.addEventListener('keydown', e => {
  keys.add(e.code);
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))
    e.preventDefault();
});
window.addEventListener('keyup', e => keys.delete(e.code));
const isLeft  = () => keys.has('ArrowLeft')  || keys.has('KeyA');
const isRight = () => keys.has('ArrowRight') || keys.has('KeyD');
const isJump  = () => keys.has('Space') || keys.has('ArrowUp') || keys.has('KeyW');

// ─── Player ──────────────────────────────────────────────────
const player = {
  x: W / 2,
  y: GROUND_Y,
  vx: 0, vy: 0,
  w: PW, h: PH,
  onGround: false,
  coyote: 0,
  jumpBuffer: 0,
  facingRight: true,

  update(dt) {
    // Horizontal
    const dx = (isRight() ? 1 : 0) - (isLeft() ? 1 : 0);
    if (dx !== 0) this.facingRight = dx > 0;
    this.vx = dx * MOVE_SPEED;

    // Jump buffering
    if (isJump()) this.jumpBuffer = JUMP_BUFFER;
    this.jumpBuffer = Math.max(0, this.jumpBuffer - dt);

    // Coyote time
    if (this.onGround) this.coyote = COYOTE_TIME;
    else               this.coyote = Math.max(0, this.coyote - dt);

    // Execute jump
    if (this.jumpBuffer > 0 && this.coyote > 0) {
      this.vy         = JUMP_VEL;
      this.coyote     = 0;
      this.jumpBuffer = 0;
    }

    // Variable jump height
    if (!isJump() && this.vy < 0) this.vy += GRAVITY * 0.6 * dt;

    // Gravity
    this.vy += GRAVITY * dt;

    // Integrate
    this.x += this.vx * dt;
    this.y += this.vy * dt;

    // Ground
    this.onGround = false;
    if (this.y >= GROUND_Y) {
      this.y = GROUND_Y;
      this.vy = 0;
      this.onGround = true;
    }

    // Wall clamp (never leave the screen)
    if (this.x < this.w / 2)       this.x = this.w / 2;
    if (this.x > W - this.w / 2)   this.x = W - this.w / 2;
  },

  draw() {
    const x = Math.round(this.x - this.w / 2);
    const y = Math.round(this.y - this.h);

    // Body block
    ctx.fillStyle = '#f0d848';
    ctx.fillRect(x, y, this.w, this.h);

    // Outline
    ctx.strokeStyle = '#b89010';
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, this.w, this.h);

    // Simple eye (facing direction)
    const eyeOffX = this.facingRight ? this.w - 10 : 6;
    ctx.fillStyle = '#222';
    ctx.fillRect(x + eyeOffX, y + 10, 6, 8);
    ctx.fillStyle = '#fff';
    ctx.fillRect(x + eyeOffX + 1, y + 11, 2, 2);
  }
};

// ─── Enemy ───────────────────────────────────────────────────
const ENEMY_SPEED     = 110;
const ATTACK_RANGE    = 90;   // px, stop and telegraph
const WINDUP_TIME     = 0.55; // telegraph duration
const ATTACK_DURATION = 0.18; // lunge duration
const COOLDOWN_TIME   = 1.1;  // rest after attack

class Enemy {
  constructor(startX) {
    this.x = startX;
    this.y = GROUND_Y;
    this.w = 40;
    this.h = 50;
    this.state = 'CHASE'; // CHASE | WINDUP | ATTACK | COOLDOWN
    this.timer = 0;
    this.lungeFromX = startX;
    this.lungeToX   = startX;
  }

  update(dt) {
    const dist = Math.abs(this.x - player.x);
    const dir  = player.x > this.x ? 1 : -1;

    switch (this.state) {
      case 'CHASE':
        if (dist < ATTACK_RANGE) {
          this.state = 'WINDUP';
          this.timer = WINDUP_TIME;
        } else {
          this.x += dir * ENEMY_SPEED * dt;
        }
        break;

      case 'WINDUP':
        // Stand still, telegraph
        this.timer -= dt;
        if (this.timer <= 0) {
          this.state      = 'ATTACK';
          this.timer      = ATTACK_DURATION;
          this.lungeFromX = this.x;
          this.lungeToX   = this.x + dir * 70;
        }
        break;

      case 'ATTACK': {
        this.timer -= dt;
        const t = 1 - (this.timer / ATTACK_DURATION);
        // Fast lunge, then snap back a bit
        this.x = this.lungeFromX + (this.lungeToX - this.lungeFromX) * Math.min(t * 2.5, 1);
        if (this.timer <= 0) {
          this.state = 'COOLDOWN';
          this.timer = COOLDOWN_TIME;
        }
        break;
      }

      case 'COOLDOWN':
        this.timer -= dt;
        if (this.timer <= 0) this.state = 'CHASE';
        break;
    }

    // Screen clamp
    if (this.x < this.w / 2)     this.x = this.w / 2;
    if (this.x > W - this.w / 2) this.x = W - this.w / 2;
  }

  draw() {
    const x = Math.round(this.x - this.w / 2);
    const y = Math.round(this.y - this.h);

    // Color by state
    const colors = {
      CHASE:    '#c0392b',
      WINDUP:   '#e67e22',   // orange telegraph
      ATTACK:   '#ff2222',
      COOLDOWN: '#6e1515',
    };
    ctx.fillStyle = colors[this.state] || '#c0392b';
    ctx.fillRect(x, y, this.w, this.h);

    ctx.strokeStyle = '#5a0000';
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, this.w, this.h);

    // Eyes
    ctx.fillStyle = '#fff';
    ctx.fillRect(x + 7,  y + 10, 8, 10);
    ctx.fillRect(x + 25, y + 10, 8, 10);
    ctx.fillStyle = '#111';
    ctx.fillRect(x + 10, y + 13, 4, 6);
    ctx.fillRect(x + 28, y + 13, 4, 6);

    // Windup indicator: exclamation mark above head
    if (this.state === 'WINDUP') {
      ctx.fillStyle = '#ffe000';
      ctx.font = 'bold 22px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('!', this.x, y - 6);
      ctx.textAlign = 'left';
    }

    // State label (debug feel)
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.font = '11px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(this.state, this.x, y - (this.state === 'WINDUP' ? 30 : 8));
    ctx.textAlign = 'left';
  }
}

const enemies = [new Enemy(W * 0.78)];

// ─── Background ──────────────────────────────────────────────
function drawBackground() {
  ctx.fillStyle = '#131f13';
  ctx.fillRect(0, 0, W, H);
}

function drawGround() {
  // Dirt
  ctx.fillStyle = '#2e4a1e';
  ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
  // Grass edge
  ctx.fillStyle = '#4e7a2e';
  ctx.fillRect(0, GROUND_Y, W, 5);
}

function drawHUD() {
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(10, 10, 290, 30);
  ctx.fillStyle = '#d0eea0';
  ctx.font = '13px monospace';
  ctx.fillText('WASD / Arrows = move    Space / W = jump', 16, 30);
}

// ─── Loop ────────────────────────────────────────────────────
let last = null;

function loop(ts) {
  const dt = last == null ? 0 : Math.min((ts - last) / 1000, 0.05);
  last = ts;

  player.update(dt);
  for (const e of enemies) e.update(dt);

  drawBackground();
  drawGround();
  for (const e of enemies) e.draw();
  player.draw();
  drawHUD();

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
